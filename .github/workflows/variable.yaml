name: Variables

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'run-environment'
                required: true
                default: 'test'
                type: choice
                options:
                 - dev
                 - prod
                 - test
            version:
                description: 'Apllication Version'
                required: true
                default: "v1.0.0"

env: 
    type_V: "Tier 1"

jobs:
    show-the-variable:
        runs-on: ubuntu-latest
        steps:
            - name: "printing the variables"
              run: | # using | this symbol we can use multiple line run 
                echo ${{inputs.environment}}
                echo ${{inputs.version}}
                echo "global $type_V"

    job1:
        runs-on: ubuntu-latest
        steps:
         - name: "printing vsrisbles"
           run: |
                echo "the secret is ${{secrets.FIRST_SECRETE}}"
                echo "the secret is ${{vars.FIRST_VARIABLE}}"




