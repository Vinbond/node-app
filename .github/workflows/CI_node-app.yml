name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start application
        run: npm start &

      - name: Wait for the application to boot
        run: sleep 5

      - name: Check the health
        run: curl -I "http://localhost:3000" || exit 1
         
            



