name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start application
        run: node app.js &

      - name: Wait for the application to boot
        run: sleep 5

      - name: Check the health
        run: curl -I "http://localhost:3000/health" || exit 1
         
            



